<!DOCTYPE html>
<html lang="th" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SportStream TV — Live TV & Sports Player</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Noto Sans Thai"', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            obsidian: '#070b12',
            surface: '#0e1522',
            card: '#141e30',
            emeraldBrand: '#10b981',
            skyBrand: '#0ea5e9',
          },
        },
      },
    };
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }

    html, body {
      background-color: #070b12;
      color: #f1f5f9;
      font-family: 'Noto Sans Thai', system-ui, -apple-system, sans-serif;
      overscroll-behavior-y: none;
      margin: 0;
      padding: 0;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.45);
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.45);
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.7);
    }

    input[type="range"].vol-slider {
      -webkit-appearance: none;
      appearance: none;
      height: 5px;
      border-radius: 9999px;
      background: rgba(148, 163, 184, 0.35);
      outline: none;
      cursor: pointer;
    }
    input[type="range"].vol-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #10b981;
      cursor: pointer;
      border: 2px solid #ecfdf5;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.65);
    }
    input[type="range"].vol-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #10b981;
      cursor: pointer;
      border: 2px solid #ecfdf5;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.65);
    }

    #playerStage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      max-height: 56vh;
      background: #000000;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      transition: all 0.22s ease;
    }

    #playerStage.css-fullscreen {
      position: fixed !important;
      inset: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      max-height: none !important;
      aspect-ratio: auto !important;
      z-index: 9999 !important;
      border-radius: 0 !important;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    #playerStage.css-fullscreen.rotated-landscape {
      width: 100vh !important;
      width: 100dvh !important;
      height: 100vw !important;
      transform: rotate(90deg);
      transform-origin: center center;
      top: 50% !important;
      left: 50% !important;
      right: auto !important;
      bottom: auto !important;
      margin-left: calc(var(--stage-w, 100vw) / -2);
      margin-top: calc(var(--stage-h, 100vh) / -2);
    }

    #playerStage:fullscreen {
      width: 100vw;
      height: 100vh;
      max-height: none;
      aspect-ratio: auto;
    }

    #videoEl {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000000;
      display: block;
    }

    .player-overlay {
      transition: opacity 0.22s ease;
    }
    .player-overlay.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.25); opacity: 0.65; }
    }
    .live-dot {
      animation: pulseDot 1.6s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-obsidian text-slate-100 min-h-screen flex flex-col">

  <!-- Top Header -->
  <header id="appHeader" class="sticky top-0 z-40 bg-surface/95 backdrop-blur-md border-b border-slate-800/80 px-3 sm:px-5 py-2.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-2">
      <!-- Brand -->
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-emerald-500 to-sky-500 flex items-center justify-center shadow-lg shadow-emerald-500/20 shrink-0">
          <svg class="w-5 h-5 text-slate-950" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5.14v14l11-7-11-7z" />
          </svg>
        </div>
        <div class="truncate">
          <div class="flex items-center gap-1.5">
            <span class="font-extrabold text-base sm:text-lg tracking-tight text-white truncate">SportStream TV</span>
            <span class="hidden sm:inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-500/15 text-emerald-400 border border-emerald-500/30">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 live-dot"></span>
              LIVE
            </span>
          </div>
          <p class="text-[11px] text-slate-400 truncate hidden md:block">เครื่องเล่นสตรีมสดกีฬา & ทีวีออนไลน์ (.m3u8)</p>
        </div>
      </div>

      <!-- Header Actions -->
      <div class="flex items-center gap-1.5 sm:gap-2 shrink-0">
        <button
          id="toggleMiniBarBtn"
          type="button"
          class="px-2.5 py-2 rounded-xl text-xs font-semibold bg-card hover:bg-slate-700/80 text-slate-200 border border-slate-700/80 active:scale-95 transition flex items-center gap-1.5"
          title="พับ/แสดงจอวิดีโอ"
        >
          <svg id="toggleMiniIcon" class="w-4 h-4 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
          </svg>
          <span id="toggleMiniLabel" class="hidden sm:inline">ซ่อนจอ</span>
        </button>

        <button
          id="openAddStreamBtn"
          type="button"
          class="px-3 py-2 rounded-xl text-xs sm:text-sm font-bold bg-emerald-500 hover:bg-emerald-400 text-slate-950 shadow-md shadow-emerald-500/20 active:scale-95 transition flex items-center gap-1.5"
        >
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
          </svg>
          <span>เพิ่มลิงก์</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Layout -->
  <main class="flex-1 max-w-7xl w-full mx-auto lg:grid lg:grid-cols-12 lg:gap-5 lg:p-5">

    <!-- Player Column -->
    <section id="playerSection" class="lg:col-span-7 xl:col-span-8 lg:sticky lg:top-20 lg:self-start">
      <div class="bg-surface lg:rounded-2xl border-b lg:border border-slate-800/90 overflow-hidden shadow-2xl">

        <!-- Video Stage -->
        <div id="playerStage" class="group">
          <video
            id="videoEl"
